apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: go-simple-webserver
  labels:
    app: go-simple-webserver
spec:
  replicas: 10
  strategy:
    canary:
      steps:
        - setWeight: 25
        - pause:
            duration: 120s
        - setWeight: 75
        - pause:
            duration: 120s
        - setWeight: 100
  selector:
    matchLabels:
      app: go-simple-webserver
  template:
    metadata:
      labels:
        app: go-simple-webserver
    spec:
      containers:
        - name: webserver
          image: ghcr.io/echimandrei/go-simple-webserver@sha256:31c934010d79ecb85841f4ad0033833474ed21e5c20fe0941cefc5f2612594ef
          ports:
            - containerPort: 8080
          imagePullPolicy: Always
